---
# ==============================================================================
# Patch RHACS Central CR: set ephemeral-storage requests/limits on scanner-db
# ==============================================================================
# Problem:
#   The upstream agnosticd.core_workloads.ocp4_workload_rhacs role's Central CR
#   never sets spec.scanner.db.resources, so the RHACS Operator's chart default
#   applies (CPU/memory only, no ephemeral-storage). scanner-db uses an emptyDir
#   (no PVC option exists for it) and restores the product's bundled CVE
#   vulnerability database on every startup, landing at ~8-9GB within minutes -
#   with zero visibility into that for the scheduler. On a workshop cluster
#   running every module's full stack concurrently, that's enough on its own to
#   push a node over its ephemeral-storage eviction threshold and cause kubelet
#   to evict unrelated pods on that node (observed: it evicted openshift-lightspeed
#   pods, not scanner-db itself).
#
# Fix:
#   Patch spec.scanner.db.resources on the Central CR so the scheduler can
#   actually account for scanner-db's real footprint when placing it, and so a
#   future runaway is capped to evicting just this pod instead of the whole
#   node. Values reflect real observed usage (~8.2-8.6GB) with headroom.
# ==============================================================================

- name: Patch Central CR to set scanner-db ephemeral-storage resources
  kubernetes.core.k8s:
    state: patched
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    name: stackrox-central-services
    namespace: stackrox
    definition:
      spec:
        scanner:
          db:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
                ephemeral-storage: 9Gi
              limits:
                cpu: "2"
                memory: 4Gi
                ephemeral-storage: 14Gi

# Patching the CR causes the RHACS Operator to recreate the scanner-db pod
# (Recreate strategy), which re-restores the bundled CVE vulnerability
# database on startup - this takes 5-10 minutes. Wait for it to come back
# healthy so a bad resource value fails this workload run loudly instead of
# silently leaving scanner-db broken for the rest of provisioning.
- name: Wait for scanner-db pod to be ready after resource patch
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: stackrox
    label_selectors:
      - app=scanner-db
  register: r_scanner_db_pod
  until: >-
    r_scanner_db_pod.resources | length > 0 and
    r_scanner_db_pod.resources[0].status.phase == 'Running' and
    r_scanner_db_pod.resources[0].status.containerStatuses[0].ready
  retries: 40
  delay: 15

# ==============================================================================
# Patch RHACS Central CR: reduce CPU requests/limits on Scanner V4 components
# ==============================================================================
# Problem:
#   The upstream agnosticd.core_workloads.ocp4_workload_rhacs role does not
#   set spec.scannerV4.{indexer,matcher,db}.resources, so the RHACS Operator's
#   chart defaults apply. Those defaults request 1500m CPU (indexer, x2
#   replicas), 500m CPU (matcher, x2 replicas) and 1000m CPU (db) - 5 full
#   cores requested for this stack alone. Live measurement on a running
#   workshop cluster showed actual usage of 2-152m CPU across all five pods
#   combined, meaning the requests are the single largest CPU over-request
#   found across the whole catalog item.
#
# Fix:
#   Patch CPU requests/limits down to reflect real usage with headroom.
#   Memory is intentionally left untouched: scanner-db's actual memory usage
#   (~6.15Gi) is close to its chart-default request (4Gi) and comfortably
#   under its limit (8Gi), so there is no memory waste to reclaim here and
#   cutting it would risk an OOM kill.
# ==============================================================================

- name: Patch Central CR to reduce Scanner V4 CPU requests/limits
  kubernetes.core.k8s:
    state: patched
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    name: stackrox-central-services
    namespace: stackrox
    definition:
      spec:
        scannerV4:
          indexer:
            resources:
              requests:
                cpu: 100m
              limits:
                cpu: "1"
          matcher:
            resources:
              requests:
                cpu: 100m
              limits:
                cpu: 500m
          db:
            resources:
              requests:
                cpu: 100m
              limits:
                cpu: "1"

# Patching the CR causes the RHACS Operator to roll the affected Scanner V4
# deployments. Unlike the scanner-db ephemeral-storage patch above, this is a
# CPU-only change (no emptyDir restore, no OOM risk), so pods come back
# quickly - but wait anyway so a bad value fails this workload run loudly
# instead of silently leaving Scanner V4 degraded for the rest of provisioning.
- name: Wait for Scanner V4 pods to be ready after resource patch
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: stackrox
    label_selectors:
      - "app in (scanner-v4-indexer, scanner-v4-matcher, scanner-v4-db)"
  register: r_scanner_v4_pods
  until: >-
    r_scanner_v4_pods.resources | length > 0 and
    r_scanner_v4_pods.resources | rejectattr('status.phase', 'equalto', 'Running') | list | length == 0 and
    r_scanner_v4_pods.resources | map(attribute='status.containerStatuses') | map('first') | rejectattr('ready') | list | length == 0
  retries: 40
  delay: 15

# ==============================================================================
# Patch RHACS Central route: passthrough → reencrypt for Showroom iframe
# ==============================================================================
# Problem:
#   RHACS Central sends X-Frame-Options: sameorigin and
#   content-security-policy: frame-ancestors 'self' in its HTTP responses.
#   The ocp4_workload_ocp_console_embed role configures the IngressController
#   to strip these headers, but that only works on edge/reencrypt routes —
#   not on the passthrough route the RHACS operator creates by default.
#   Result: Showroom cannot embed RHACS in an iframe tab.
#
# Fix:
#   Change the Central route from passthrough → reencrypt. This lets HAProxy
#   terminate TLS on the external side and re-encrypt to the Central pod,
#   giving it control over response headers.
#
# CA trust:
#   For reencrypt, HAProxy must verify Central's backend TLS cert. Central
#   may serve either a Let's Encrypt cert (from rhacs-central-tls, provisioned
#   by the platform) or a StackRox-signed cert (from central-tls). We provide
#   a combined destinationCACertificate containing:
#     1. The StackRox internal CA  — covers the StackRox-signed cert
#     2. The cluster trusted CA bundle — covers Let's Encrypt / any public CA
# ==============================================================================

- name: Get ingress controller default certificate name
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: IngressController
    name: default
    namespace: openshift-ingress-operator
  register: r_ingress_controller

- name: Get ingress certificate secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ r_ingress_controller.resources[0].spec.defaultCertificate.name | default('router-certs-default') }}"
    namespace: openshift-ingress
  register: r_ingress_cert_secret

- name: Get StackRox central TLS secret (internal CA)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: central-tls
    namespace: stackrox
  register: r_central_tls_secret

# The cluster trusted CA bundle includes all public root CAs (e.g. ISRG Root X1
# for Let's Encrypt). Without it, HAProxy cannot verify the full certificate
# chain when Central serves a Let's Encrypt cert on a reencrypt route.
- name: Get cluster trusted CA bundle (public root CAs)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: trusted-ca-bundle
    namespace: openshift-config-managed
  register: r_trusted_ca_bundle

- name: Build combined destination CA certificate
  ansible.builtin.set_fact:
    _rhacs_combined_destination_ca: >-
      {{ r_central_tls_secret.resources[0].data['ca.pem'] | b64decode }}
      {{ r_trusted_ca_bundle.resources[0].data['ca-bundle.crt'] | default('') }}

- name: Patch Central route to reencrypt with combined CA trust
  kubernetes.core.k8s:
    state: patched
    api_version: route.openshift.io/v1
    kind: Route
    name: central
    namespace: stackrox
    definition:
      spec:
        tls:
          termination: reencrypt
          certificate: "{{ r_ingress_cert_secret.resources[0].data['tls.crt'] | b64decode }}"
          key: "{{ r_ingress_cert_secret.resources[0].data['tls.key'] | b64decode }}"
          destinationCACertificate: "{{ _rhacs_combined_destination_ca }}"
          insecureEdgeTerminationPolicy: Redirect

- name: Get Central route after patch
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: central
    namespace: stackrox
  register: r_central_route

- name: Verify Central is reachable after route patch
  ansible.builtin.uri:
    url: "https://{{ r_central_route.resources[0].spec.host }}/v1/ping"
    method: GET
    validate_certs: false
    status_code: [200, 401]
  register: r_central_verify
  retries: 10
  delay: 5
  until: r_central_verify.status in [200, 401]

- name: Report result
  debug:
    msg: >-
      Central route patched to reencrypt.
      Host: {{ r_central_route.resources[0].spec.host }},
      Termination: {{ r_central_route.resources[0].spec.tls.termination }}
